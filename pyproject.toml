[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sw-scanner"
version = "0.1.0"
description = "Solar Wind Scanner — detecting non-Gaussian structures in solar wind data using Jensen-Shannon divergence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jason Huang", email = "huangzesen@gmail.com" },
]
keywords = [
    "solar-wind",
    "space-physics",
    "jensen-shannon",
    "divergence",
    "magnetic-field",
    "plasma-physics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "scipy",
    "tqdm",
    "numba",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/huangzesen/sw_scanner"
Repository = "https://github.com/huangzesen/sw_scanner"

[tool.hatch.build.targets.wheel]
packages = ["src/sw_scanner"]
